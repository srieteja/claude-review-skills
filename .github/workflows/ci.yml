name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck (errors)
        run: |
          grep -rlE '^#!.*(ba)?sh|^# shellcheck shell=' bin lib skills | sort -u | xargs shellcheck -S error
      - name: no personal paths or handles
        run: |
          ! git grep -nE '/Users/|-Users-|srieteja|\bgkc\b' -- . ':!.github/workflows/ci.yml' \
            | grep -vE '/Users/someone/|github\.com/srieteja/claude-review-skills'

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: tools (macOS)
        if: runner.os == 'macOS'
        run: brew install coreutils jq
      - name: tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/pr-review/mermaid/package-lock.json
      - name: mermaid, for the diagram suites
        run: npm ci --prefix skills/pr-review/mermaid --no-audit --no-fund
      - name: git identity for the fixture repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: offline suites
        run: bin/review-skills test
